<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>积分兑存报表</title>
  <link rel="stylesheet" href="../resources/style.css">
  <style>
    .report-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .chart-wrap { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 14px; }
    .chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .chart-head h3 { margin: 0; color: var(--navy); font-size: 15px; }
    .chart-note { color: var(--muted); font-size: 12px; font-weight: 800; }
    .bar-list { display: grid; gap: 16px; }
    .bar-row { display: grid; grid-template-columns: 118px 1fr 116px; gap: 12px; align-items: center; }
    .bar-name { color: #123152; font-weight: 800; }
    .bar-track { height: 22px; border-radius: 999px; background: #eef4fb; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2f6fbd, #2f9b6b); }
    .bar-value { color: #123152; font-weight: 800; text-align: right; }
    .flow-list { display: grid; gap: 14px; }
    .flow-row { display: grid; grid-template-columns: 86px 1fr 92px; gap: 10px; align-items: center; color: #123152; font-weight: 800; }
    .flow-track { height: 18px; border-radius: 999px; background: #eef4fb; overflow: hidden; }
    .flow-fill { height: 100%; border-radius: 999px; }
    .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 24px; border-radius: 999px; background: #eef4fb; color: #123152; font-weight: 800; font-size: 12px; }
    .num-link { color: #0b5da8; font-weight: 800; text-decoration: underline; text-underline-offset: 2px; }
    .org-tree-select { position: relative; width: 100%; }
    .org-tree-trigger {
      width: 100%; height: 34px; padding: 0 32px 0 12px; border: 1px solid var(--line);
      border-radius: 5px; background: #fff; color: var(--text); text-align: left; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative;
    }
    .org-tree-trigger::after { content: "⌄"; position: absolute; right: 11px; top: 50%; transform: translateY(-55%); color: #667789; }
    .org-tree-panel {
      display: none; position: absolute; z-index: 30; top: calc(100% + 4px); left: 0;
      min-width: 100%; width: max-content; max-width: 420px; max-height: 320px; overflow: auto;
      padding: 6px 0; border: 1px solid var(--line); border-radius: 5px; background: #fff;
      box-shadow: 0 8px 24px rgba(31, 55, 78, .16);
    }
    .org-tree-select.open .org-tree-panel { display: block; }
    .org-tree-row { display: flex; align-items: center; gap: 6px; min-width: 210px; padding: 7px 12px; color: #334a62; cursor: pointer; white-space: nowrap; }
    .org-tree-row:hover { background: #eef6ff; color: var(--brand); }
    .org-tree-toggle { width: 16px; flex: 0 0 16px; color: #667789; text-align: center; }
    .org-tree-level-2 { padding-left: 28px; }
    .org-tree-level-3 { padding-left: 52px; }
    .org-tree-level-4 { padding-left: 76px; }
    .org-tree-leaf .org-tree-toggle { color: transparent; }
    .dimension-field[hidden] { display: none; }
    .report-context {
      display: flex; align-items: center; min-height: 32px; margin-bottom: 12px; padding: 7px 12px;
      border: 1px solid #d9e9f4; border-radius: 5px; background: #f6fbff; color: var(--muted); font-size: 13px;
    }
    .report-context .link { margin: 0 4px; }
    .report-context strong { color: var(--ink); }
    .drill-link { display: inline-flex; align-items: center; gap: 5px; }
    .drill-link::after { content: "›"; font-size: 16px; line-height: 1; }
    @media (max-width: 1180px) {
      .report-grid { grid-template-columns: 1fr; }
      .bar-row { grid-template-columns: 96px 1fr; }
      .bar-value { grid-column: 2; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="filter" style="grid-template-columns:repeat(5,minmax(0,1fr)) auto auto">
      <div class="field"><label>统计周期</label><select id="periodType"><option>日</option><option selected>月</option><option>季</option><option>年</option></select></div>
      <div class="field"><label>统计时间</label><select id="periodValue"></select></div>
      <div class="field"><label>积分类型</label><select id="pointsType"><option selected>消费积分</option><option>碳积分</option></select></div>
      <div class="field"><label>统计目标</label><select id="statisticsTarget"><option value="org" selected>发放组织</option><option value="project">发放项目</option></select></div>
      <div class="field dimension-field" id="orgFilter"><label>发放组织</label>
        <div class="org-tree-select" data-org-tree data-tree-type="org" data-org-all="全部组织">
          <button class="org-tree-trigger" type="button">全部组织</button><input type="hidden" value="全部组织"><div class="org-tree-panel"></div>
        </div>
      </div>
      <div class="field dimension-field" id="projectFilter" hidden><label>发放项目</label>
        <div class="org-tree-select" data-org-tree data-tree-type="project" data-org-all="全部项目">
          <button class="org-tree-trigger" type="button">全部项目</button><input type="hidden" value="全部项目"><div class="org-tree-panel"></div>
        </div>
      </div>
      <button class="btn primary" id="queryBtn">查询</button>
      <button class="btn" id="resetBtn">重置</button>
    </div>

    <div class="report-grid">
      <div class="chart-wrap">
        <div class="chart-head">
          <h3 id="dimensionChartTitle">各发放组织期末余额</h3>
          <span class="chart-note">按期末余额降序</span>
        </div>
        <div class="bar-list" id="balanceBars"></div>
      </div>
      <div class="chart-wrap">
        <div class="chart-head">
          <h3>周期内积分变动汇总</h3>
          <span class="chart-note">新增 / 消耗 / 过期</span>
        </div>
        <div class="flow-list" id="flowBars"></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-hd">
        <h3>积分兑存统计明细</h3>
        <div class="toolbar"><button class="btn">导出</button></div>
      </div>
      <div class="panel-bd">
        <div class="report-context" id="reportContext"></div>
        <table>
          <thead>
            <tr><th id="dimensionHeader">发放组织</th><th>期初余额</th><th>本期新增</th><th>本期消耗</th><th>本期过期</th><th>期末余额</th></tr>
          </thead>
          <tbody id="flowRows"></tbody>
        </table>
        <div class="pagination"><span id="totalCount">共 0 条</span><span>每页</span><select><option selected>20 条</option></select><button class="page-btn active">1</button></div>
      </div>
    </div>
  </div>

  <script>
    const projectTreeData = [{
      name: "广东省",
      children: [
        { name: "深圳市", children: [
          { name: "南山区", children: ["高新安荟邻", "高新花园"] },
          { name: "福田区", children: ["景田安荟邻"] },
          { name: "坪山区", children: ["秀馨苑"] },
          { name: "宝安区", children: ["宝安人才园"] }
        ] },
        { name: "广州市", children: [
          { name: "天河区", children: ["天河安居项目"] },
          { name: "海珠区", children: ["海珠安居项目"] }
        ] }
      ]
    }];
    const orgTreeData = [
      { name: "商业板块", children: ["安计部", "数字运营部", "商业运营部", "招商管理部"] },
      { name: "住宅板块", children: ["住宅运营部", "营销管理部", "客户服务部", "工程管理部"] },
      { name: "物业板块", children: ["物业管理部", "品质管理部", "安全管理部", "环境管理部"] },
      { name: "集团职能", children: ["财务管理部", "人力资源部", "信息技术部", "审计风控部"] }
    ];
    const projectExpandedKeys = [
      "广东省", "广东省/深圳市", "广东省/深圳市/南山区", "广东省/深圳市/福田区",
      "广东省/深圳市/坪山区", "广东省/深圳市/宝安区", "广东省/广州市",
      "广东省/广州市/天河区", "广东省/广州市/海珠区"
    ];
    const orgExpandedKeys = ["商业板块", "住宅板块", "物业板块", "集团职能"];

    const orgReportData = [
      { name: "商业板块", opening: 12860000, added: 3068000, consumed: 1860000, expired: 326000, children: [
        { name: "安计部", opening: 4200000, added: 1050000, consumed: 620000, expired: 110000 },
        { name: "数字运营部", opening: 3400000, added: 890000, consumed: 520000, expired: 90000 },
        { name: "商业运营部", opening: 2900000, added: 680000, consumed: 420000, expired: 74000 },
        { name: "招商管理部", opening: 2360000, added: 448000, consumed: 300000, expired: 52000 }
      ] },
      { name: "住宅板块", opening: 7820000, added: 1786000, consumed: 1124000, expired: 186000, children: [
        { name: "住宅运营部", opening: 2500000, added: 630000, consumed: 400000, expired: 60000 },
        { name: "营销管理部", opening: 2000000, added: 495000, consumed: 300000, expired: 50000 },
        { name: "客户服务部", opening: 1800000, added: 375000, consumed: 250000, expired: 42000 },
        { name: "工程管理部", opening: 1520000, added: 286000, consumed: 174000, expired: 34000 }
      ] },
      { name: "物业板块", opening: 6420000, added: 1428000, consumed: 886000, expired: 142000, children: [
        { name: "物业管理部", opening: 2100000, added: 490000, consumed: 310000, expired: 48000 },
        { name: "品质管理部", opening: 1700000, added: 360000, consumed: 220000, expired: 36000 },
        { name: "安全管理部", opening: 1420000, added: 315000, consumed: 190000, expired: 31000 },
        { name: "环境管理部", opening: 1200000, added: 263000, consumed: 166000, expired: 27000 }
      ] },
      { name: "集团职能", opening: 4860000, added: 1046000, consumed: 624000, expired: 98000, children: [
        { name: "财务管理部", opening: 1400000, added: 320000, consumed: 190000, expired: 30000 },
        { name: "人力资源部", opening: 1260000, added: 285000, consumed: 170000, expired: 26000 },
        { name: "信息技术部", opening: 1200000, added: 241000, consumed: 144000, expired: 22000 },
        { name: "审计风控部", opening: 1000000, added: 200000, consumed: 120000, expired: 20000 }
      ] }
    ];
    const projectReportData = [
      { name: "高新安荟邻", opening: 6200000, added: 1330000, consumed: 820000, expired: 128000 },
      { name: "高新花园", opening: 5400000, added: 1130000, consumed: 680000, expired: 105000 },
      { name: "景田安荟邻", opening: 4800000, added: 985000, consumed: 590000, expired: 92000 },
      { name: "秀馨苑", opening: 4200000, added: 880000, consumed: 520000, expired: 80000 },
      { name: "宝安人才园", opening: 3700000, added: 770000, consumed: 450000, expired: 69000 }
    ];
    const flowMeta = [
      { key: "added", name: "本期新增", color: "#2f6fbd" },
      { key: "consumed", name: "本期消耗", color: "#2f9b6b" },
      { key: "expired", name: "本期过期", color: "#d8892c" }
    ];

    const periodTypeSelect = document.getElementById("periodType");
    const periodValueSelect = document.getElementById("periodValue");
    const targetSelect = document.getElementById("statisticsTarget");
    const orgFilter = document.getElementById("orgFilter");
    const projectFilter = document.getElementById("projectFilter");
    const dimensionHeader = document.getElementById("dimensionHeader");
    const dimensionChartTitle = document.getElementById("dimensionChartTitle");
    const reportContext = document.getElementById("reportContext");
    const totalCount = document.getElementById("totalCount");
    const flowRows = document.getElementById("flowRows");
    let drillPath = [];

    function format(num) {
      return num.toLocaleString("zh-CN");
    }

    function closing(item) {
      return item.opening + item.added - item.consumed - item.expired;
    }

    function currentRows() {
      if (targetSelect.value === "project") return projectReportData;
      if (!drillPath.length) return orgReportData;
      const parent = orgReportData.find(item => item.name === drillPath[0]);
      return parent && parent.children ? parent.children : orgReportData;
    }

    function renderBalanceBars(list) {
      const max = Math.max(...list.map(closing));
      document.getElementById("balanceBars").innerHTML = list.map(item => {
        const end = closing(item);
        return `
          <div class="bar-row">
            <div class="bar-name">${item.name}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${end / max * 100}%"></div></div>
            <div class="bar-value">${format(end)}</div>
          </div>
        `;
      }).join("");
    }

    function renderFlowBars(list) {
      const totals = flowMeta.map(item => ({
        ...item,
        total: list.reduce((sum, row) => sum + row[item.key], 0)
      }));
      const max = Math.max(...totals.map(item => item.total));
      document.getElementById("flowBars").innerHTML = totals.map(item => `
        <div class="flow-row">
          <span>${item.name}</span>
          <div class="flow-track"><div class="flow-fill" style="width:${item.total / max * 100}%;background:${item.color}"></div></div>
          <span>${format(item.total)}</span>
        </div>
      `).join("");
    }

    function renderRows(list) {
      const isOrg = targetSelect.value === "org";
      const dimensionName = isOrg ? "发放组织" : "发放项目";
      dimensionHeader.textContent = dimensionName;
      dimensionChartTitle.textContent = `各${dimensionName}期末余额`;
      reportContext.innerHTML = `<strong>当前统计维度：</strong>${dimensionName}<span style="margin:0 10px;color:#b7c7d4">|</span><strong>统计层级：</strong>${isOrg ? `<a class="link" href="#" data-drill-home>全部发放组织</a>${drillPath.map(name => ` / <span>${name}</span>`).join("")}` : "发放项目"}`;
      flowRows.innerHTML = list.map(item => {
        const canDrill = isOrg && Array.isArray(item.children) && item.children.length;
        const dimension = canDrill ? `<a class="link drill-link" href="#" data-drill-name="${item.name}">${item.name}</a>` : item.name;
        return `
          <tr>
            <td>${dimension}</td>
            <td>${format(item.opening)}</td>
            <td>${format(item.added)}</td>
            <td>${format(item.consumed)}</td>
            <td>${format(item.expired)}</td>
            <td><span class="tag">${format(closing(item))}</span></td>
          </tr>
        `;
      }).join("");
      totalCount.textContent = `共 ${list.length} 条`;
    }

    function renderAll() {
      const list = currentRows();
      renderBalanceBars(list);
      renderFlowBars(list);
      renderRows(list);
    }

    function syncPeriodOptions() {
      const options = {
        "日": ["2026-06-30", "2026-06-29", "2026-06-28", "2026-06-27"],
        "月": ["2026-06", "2026-05", "2026-04", "2026-03", "2026-02", "2026-01"],
        "季": ["2026年第2季度", "2026年第1季度", "2025年第4季度", "2025年第3季度"],
        "年": ["2026年", "2025年", "2024年"]
      };
      periodValueSelect.innerHTML = options[periodTypeSelect.value].map((item, index) =>
        `<option ${index === 0 ? "selected" : ""}>${item}</option>`
      ).join("");
    }

    function syncTarget() {
      const isOrg = targetSelect.value === "org";
      orgFilter.hidden = !isOrg;
      projectFilter.hidden = isOrg;
      drillPath = [];
      renderAll();
    }

    function renderOrgTree(tree, expanded) {
      const allLabel = tree.dataset.orgAll;
      const treeData = tree.dataset.treeType === "org" ? orgTreeData : projectTreeData;
      const rows = [`<div class="org-tree-row org-tree-leaf" data-org-path="${allLabel}"><span class="org-tree-toggle">·</span><span>${allLabel}</span></div>`];
      const renderNodes = (nodes, parents = [], depth = 1) => {
        nodes.forEach(node => {
          const item = typeof node === "string" ? { name: node } : node;
          const key = [...parents, item.name].join("/");
          const path = [...parents, item.name].join(" / ");
          const hasChildren = Array.isArray(item.children) && item.children.length > 0;
          const isOpen = expanded.has(key);
          rows.push(`<div class="org-tree-row org-tree-level-${Math.min(depth, 4)}${hasChildren ? "" : " org-tree-leaf"}" ${hasChildren ? `data-org-toggle="${key}"` : `data-org-path="${path}"`}><span class="org-tree-toggle">${hasChildren ? (isOpen ? "▾" : "▸") : "·"}</span><span>${item.name}</span></div>`);
          if (hasChildren && isOpen) renderNodes(item.children, [...parents, item.name], depth + 1);
        });
      };
      renderNodes(treeData);
      tree.querySelector(".org-tree-panel").innerHTML = rows.join("");
    }

    document.querySelectorAll("[data-org-tree]").forEach(tree => {
      const expanded = new Set(tree.dataset.treeType === "org" ? orgExpandedKeys : projectExpandedKeys);
      const trigger = tree.querySelector(".org-tree-trigger");
      const hiddenInput = tree.querySelector("input");
      const panel = tree.querySelector(".org-tree-panel");
      renderOrgTree(tree, expanded);
      trigger.addEventListener("click", event => {
        event.stopPropagation();
        document.querySelectorAll("[data-org-tree].open").forEach(item => {
          if (item !== tree) item.classList.remove("open");
        });
        tree.classList.toggle("open");
      });
      panel.addEventListener("click", event => {
        const row = event.target.closest(".org-tree-row");
        if (!row) return;
        if (row.dataset.orgToggle) {
          expanded.has(row.dataset.orgToggle) ? expanded.delete(row.dataset.orgToggle) : expanded.add(row.dataset.orgToggle);
          renderOrgTree(tree, expanded);
          return;
        }
        if (row.dataset.orgPath) {
          trigger.textContent = row.dataset.orgPath;
          hiddenInput.value = row.dataset.orgPath;
          tree.classList.remove("open");
        }
      });
    });
    document.addEventListener("click", event => {
      document.querySelectorAll("[data-org-tree].open").forEach(tree => {
        if (!tree.contains(event.target)) tree.classList.remove("open");
      });
    });
    periodTypeSelect.addEventListener("change", syncPeriodOptions);
    targetSelect.addEventListener("change", syncTarget);
    document.getElementById("queryBtn").addEventListener("click", () => {
      drillPath = [];
      renderAll();
    });
    document.getElementById("resetBtn").addEventListener("click", () => {
      periodTypeSelect.value = "月";
      document.getElementById("pointsType").value = "消费积分";
      syncPeriodOptions();
      targetSelect.value = "org";
      document.querySelectorAll("[data-org-tree]").forEach(tree => {
        const allLabel = tree.dataset.orgAll;
        tree.querySelector(".org-tree-trigger").textContent = allLabel;
        tree.querySelector("input").value = allLabel;
      });
      syncTarget();
    });
    flowRows.addEventListener("click", event => {
      const drillLink = event.target.closest("[data-drill-name]");
      if (!drillLink) return;
      event.preventDefault();
      drillPath = [drillLink.dataset.drillName];
      renderAll();
    });
    reportContext.addEventListener("click", event => {
      if (!event.target.closest("[data-drill-home]")) return;
      event.preventDefault();
      drillPath = [];
      renderAll();
    });
    syncPeriodOptions();
    syncTarget();
  </script>
</body>
</html>
