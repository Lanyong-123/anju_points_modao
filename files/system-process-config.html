<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>流程配置管理</title>
  <link rel="stylesheet" href="../resources/style.css?v=20261029-4">
  <style>
    .process-page { min-width: 980px; }
    .process-tabs {
      display: flex;
      align-items: flex-end;
      min-height: 48px;
      padding: 0 18px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      box-shadow: var(--shadow);
    }
    .process-tab {
      position: relative;
      height: 48px;
      padding: 0 18px;
      border: 0;
      background: transparent;
      color: var(--brand-deep);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .process-tab::after {
      content: "";
      position: absolute;
      right: 14px;
      bottom: -1px;
      left: 14px;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--brand);
    }
    .flow-overview {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(255,255,255,.96);
      box-shadow: var(--shadow);
    }
    .flow-steps {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .flow-step {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #526477;
      font-weight: 800;
    }
    .flow-step strong { color: var(--brand-deep); }
    .flow-arrow { color: #91a6b8; font-weight: 900; }
    .flow-actions { display: flex; flex: 0 0 auto; gap: 10px; }
    .node-list { display: grid; gap: 16px; }
    .node-card {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr);
      min-height: 210px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .node-summary {
      padding: 22px 22px 18px;
      background: linear-gradient(180deg, #eefaff 0%, #f7fcff 100%);
      border-right: 1px solid #dcecf6;
    }
    .node-number {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font-size: 18px;
      font-weight: 900;
    }
    .node-name-input {
      width: 100%;
      height: 38px;
      margin-top: 16px;
      padding: 0;
      border: 0;
      border-bottom: 1px solid transparent;
      border-radius: 0;
      background: transparent;
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
    }
    .node-name-input:hover { border-bottom-color: #b8cfe3; }
    .node-name-input:focus {
      border-bottom-color: var(--brand);
      outline: 0;
      box-shadow: none;
    }
    .node-config { padding: 20px 22px; }
    .node-config-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .node-status {
      padding: 4px 9px;
      border-radius: 999px;
      background: #e9f8f3;
      color: #16845b;
      font-size: 12px;
      font-weight: 800;
    }
    .node-fields {
      display: grid;
      grid-template-columns: minmax(200px, .9fr) minmax(260px, 1.2fr) minmax(260px, 1.1fr);
      gap: 16px;
      align-items: start;
    }
    .review-target {
      display: flex;
      align-items: center;
      gap: 18px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid #b8cfe3;
      border-radius: 5px;
      background: #fbfdff;
    }
    .review-target label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      white-space: nowrap;
      cursor: pointer;
    }
    .review-target input[type="radio"] {
      width: 16px;
      height: 16px;
      margin: 0;
    }
    .role-multi { position: relative; }
    .role-multi-trigger {
      display: flex;
      width: 100%;
      height: 34px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 10px;
      overflow: hidden;
      border: 1px solid #b8cfe3;
      border-radius: 5px;
      background: #fff;
      color: #24364a;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .role-multi-trigger span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .role-multi-trigger i { flex: 0 0 auto; color: #687f93; font-style: normal; }
    .role-multi.open .role-multi-trigger { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(20,132,204,.12); }
    .role-multi.invalid .role-multi-trigger { border-color: #e5484d; }
    .role-multi-menu {
      position: absolute;
      top: calc(100% + 5px);
      right: 0;
      left: 0;
      z-index: 20;
      display: none;
      padding: 6px;
      border: 1px solid #b8cfe3;
      border-radius: 6px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(27,61,91,.16);
    }
    .role-multi.open .role-multi-menu { display: grid; }
    .role-multi-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      margin: 0;
      padding: 0 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .role-multi-option:hover { background: #edf7ff; }
    .role-multi-option input { width: 15px; height: 15px; margin: 0; }
    .multi-select-hint { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .node-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
    .empty-state {
      padding: 50px 20px;
      border: 1px dashed #9fc4dc;
      border-radius: 10px;
      background: rgba(255,255,255,.82);
      color: var(--muted);
      text-align: center;
    }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      display: none;
      min-width: 240px;
      padding: 12px 16px;
      border-radius: 7px;
      background: #123152;
      color: #fff;
      box-shadow: 0 14px 32px rgba(18,49,82,.24);
      font-size: 13px;
      font-weight: 800;
    }
    .toast.open { display: block; }
    @media (max-width: 1180px) {
      .node-card { grid-template-columns: 180px minmax(0, 1fr); }
      .node-fields { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="page process-page">
    <div class="process-tabs" role="tablist" aria-label="审核流程">
      <button class="process-tab" type="button" role="tab" aria-selected="true">积分账户变更审核流程</button>
    </div>

    <div class="flow-overview">
      <div class="flow-steps" id="flowSteps"></div>
      <div class="flow-actions">
        <button class="btn primary" type="button" id="addNode">新增流程节点</button>
        <button class="btn primary" type="button" id="saveFlow">保存配置</button>
      </div>
    </div>

    <div class="node-list" id="nodeList"></div>
  </div>

  <div class="toast" id="toast">流程配置已保存</div>

  <script>
    const levelOptions = [
      { value: "minister", label: "部长层级" },
      { value: "department-head", label: "部门负责人层级" },
      { value: "director", label: "中心负责人层级" }
    ];
    const roleOptions = {
      minister: ["积分运营部长", "财务管理部长", "风控管理部长"],
      "department-head": ["积分运营部负责人", "财务管理部负责人", "风控管理部负责人"],
      director: ["会员运营中心负责人", "数字运营中心负责人"]
    };
    const personOptions = {
      minister: ["张伟（积分运营部长）", "李娜（财务管理部长）", "王敏（风控管理部长）"],
      "department-head": ["陈刚（积分运营部负责人）", "赵宁（财务管理部负责人）", "刘敏（风控管理部负责人）"],
      director: ["周海（会员运营中心负责人）", "林岚（数字运营中心负责人）"]
    };
    let nodeSeed = 2;
    let nodes = [
      { id: 1, name: "部长审核", level: "minister", targetType: "role", assignee: ["积分运营部长"] },
      { id: 2, name: "部门负责人审核", level: "department-head", targetType: "role", assignee: ["积分运营部负责人"] }
    ];

    const nodeList = document.getElementById("nodeList");
    const flowSteps = document.getElementById("flowSteps");
    const toast = document.getElementById("toast");

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    function targetOptions(node) {
      return node.targetType === "person" ? personOptions[node.level] : roleOptions[node.level];
    }

    function optionHtml(options, selected) {
      const selectedValues = Array.isArray(selected) ? selected : [selected];
      return options.map(item => `<option${selectedValues.includes(item) ? " selected" : ""}>${item}</option>`).join("");
    }

    function roleMultiHtml(node) {
      const selectedRoles = Array.isArray(node.assignee) ? node.assignee : [];
      const summary = selectedRoles.length ? selectedRoles.join("、") : "请选择审核角色";
      return `
        <div class="role-multi" data-role-multi>
          <button class="role-multi-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span>${escapeHtml(summary)}</span><i>⌄</i></button>
          <div class="role-multi-menu" role="listbox" aria-multiselectable="true">
            ${targetOptions(node).map(role => `<label class="role-multi-option"><input type="checkbox" data-role-option value="${escapeHtml(role)}"${selectedRoles.includes(role) ? " checked" : ""}>${escapeHtml(role)}</label>`).join("")}
          </div>
        </div>`;
    }

    function renderFlowSteps() {
      if (!nodes.length) {
        flowSteps.innerHTML = '<span style="color:var(--muted)">尚未配置审核节点</span>';
        return;
      }
      flowSteps.innerHTML = nodes.map((node, index) => `
        <span class="flow-step" data-flow-step-id="${node.id}"><strong>${String(index + 1).padStart(2, "0")}</strong><span>${escapeHtml(node.name)}</span></span>
        ${index < nodes.length - 1 ? '<span class="flow-arrow">→</span>' : ""}
      `).join("");
    }

    function renderNodes() {
      renderFlowSteps();
      if (!nodes.length) {
        nodeList.innerHTML = '<div class="empty-state"><strong>暂无流程节点</strong><br>点击“新增流程节点”开始配置审核流程。</div>';
        return;
      }
      nodeList.innerHTML = nodes.map((node, index) => `
        <section class="node-card" data-node-id="${node.id}">
          <div class="node-summary">
            <div class="node-number">${String(index + 1).padStart(2, "0")}</div>
            <input class="node-name-input" data-node-field="name" value="${escapeHtml(node.name)}" maxlength="20" aria-label="节点名称" placeholder="请输入节点名称">
          </div>
          <div class="node-config">
            <div class="node-config-head"><strong>节点配置</strong><span class="node-status">已配置</span></div>
            <div class="node-fields">
              <div class="field">
                <label class="required">审核角色层级</label>
                <select data-node-field="level">${levelOptions.map(item => `<option value="${item.value}"${item.value === node.level ? " selected" : ""}>${item.label}</option>`).join("")}</select>
              </div>
              <div class="field">
                <label class="required">审核对象</label>
                <div class="review-target">
                  <label><input type="radio" name="target-${node.id}" value="role"${node.targetType === "role" ? " checked" : ""}>审核角色</label>
                  <label><input type="radio" name="target-${node.id}" value="person"${node.targetType === "person" ? " checked" : ""}>审核人</label>
                </div>
              </div>
              <div class="field assignee-field">
                <label class="required">${node.targetType === "person" ? "选择审核人" : "选择审核角色"}</label>
                ${node.targetType === "role" ? roleMultiHtml(node) : `<select data-node-field="assignee">${optionHtml(targetOptions(node), node.assignee)}</select>`}
                ${node.targetType === "role" ? '<div class="multi-select-hint">支持多选，可同时配置多个审核角色</div>' : ""}
              </div>
            </div>
            <div class="node-actions">
              <button class="btn" type="button" data-move="up"${index === 0 ? " disabled" : ""}>上移</button>
              <button class="btn" type="button" data-move="down"${index === nodes.length - 1 ? " disabled" : ""}>下移</button>
              <button class="btn" type="button" data-delete-node>删除节点</button>
            </div>
          </div>
        </section>
      `).join("");
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("open");
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove("open"), 1800);
    }

    nodeList.addEventListener("change", event => {
      const card = event.target.closest("[data-node-id]");
      if (!card) return;
      const node = nodes.find(item => item.id === Number(card.dataset.nodeId));
      if (!node) return;
      if (event.target.matches("[data-role-option]")) {
        node.assignee = Array.from(card.querySelectorAll("[data-role-option]:checked")).map(input => input.value);
        const roleMulti = card.querySelector("[data-role-multi]");
        roleMulti.classList.remove("invalid");
        roleMulti.querySelector(".role-multi-trigger span").textContent = node.assignee.length ? node.assignee.join("、") : "请选择审核角色";
        return;
      }
      if (event.target.matches('[data-node-field="name"]')) node.name = event.target.value.trim();
      if (event.target.matches('[data-node-field="level"]')) {
        node.level = event.target.value;
        node.assignee = node.targetType === "person" ? personOptions[node.level][0] : [roleOptions[node.level][0]];
      }
      if (event.target.matches('input[type="radio"]')) {
        node.targetType = event.target.value;
        node.assignee = node.targetType === "person" ? personOptions[node.level][0] : [roleOptions[node.level][0]];
      }
      if (event.target.matches('[data-node-field="assignee"]')) {
        node.assignee = node.targetType === "role"
          ? Array.from(event.target.selectedOptions).map(option => option.value)
          : event.target.value;
      }
      renderNodes();
    });

    nodeList.addEventListener("input", event => {
      if (!event.target.matches('[data-node-field="name"]')) return;
      const card = event.target.closest("[data-node-id]");
      const node = nodes.find(item => item.id === Number(card?.dataset.nodeId));
      if (!node) return;
      node.name = event.target.value;
      const stepName = flowSteps.querySelector(`[data-flow-step-id="${node.id}"] span`);
      if (stepName) stepName.textContent = node.name || "未命名节点";
    });

    nodeList.addEventListener("click", event => {
      const roleTrigger = event.target.closest(".role-multi-trigger");
      if (roleTrigger) {
        const roleMulti = roleTrigger.closest("[data-role-multi]");
        nodeList.querySelectorAll("[data-role-multi].open").forEach(item => {
          if (item !== roleMulti) {
            item.classList.remove("open");
            item.querySelector(".role-multi-trigger").setAttribute("aria-expanded", "false");
          }
        });
        roleMulti.classList.toggle("open");
        roleTrigger.setAttribute("aria-expanded", String(roleMulti.classList.contains("open")));
        return;
      }
      const card = event.target.closest("[data-node-id]");
      if (!card) return;
      const index = nodes.findIndex(item => item.id === Number(card.dataset.nodeId));
      if (event.target.closest("[data-delete-node]")) {
        nodes.splice(index, 1);
        renderNodes();
        showToast("流程节点已删除");
        return;
      }
      const move = event.target.closest("[data-move]")?.dataset.move;
      if (move === "up" && index > 0) [nodes[index - 1], nodes[index]] = [nodes[index], nodes[index - 1]];
      if (move === "down" && index < nodes.length - 1) [nodes[index + 1], nodes[index]] = [nodes[index], nodes[index + 1]];
      if (move) renderNodes();
    });

    document.getElementById("addNode").addEventListener("click", () => {
      nodeSeed += 1;
      nodes.push({ id: nodeSeed, name: "新增审核节点", level: "minister", targetType: "role", assignee: [roleOptions.minister[0]] });
      renderNodes();
      showToast("已新增流程节点");
    });

    document.getElementById("saveFlow").addEventListener("click", () => {
      if (!nodes.length) {
        showToast("请至少配置一个审核节点");
        return;
      }
      const unassignedRoleNode = nodes.find(node => node.targetType === "role" && !node.assignee.length);
      if (unassignedRoleNode) {
        const roleMulti = nodeList.querySelector(`[data-node-id="${unassignedRoleNode.id}"] [data-role-multi]`);
        roleMulti.classList.add("invalid", "open");
        roleMulti.querySelector(".role-multi-trigger").setAttribute("aria-expanded", "true");
        showToast("请至少选择一个审核角色");
        return;
      }
      const emptyNameNode = nodes.find(node => !node.name.trim());
      if (emptyNameNode) {
        const input = nodeList.querySelector(`[data-node-id="${emptyNameNode.id}"] [data-node-field="name"]`);
        input.setCustomValidity("请输入节点名称");
        input.reportValidity();
        input.addEventListener("input", () => input.setCustomValidity(""), { once: true });
        return;
      }
      showToast("积分账户变更审核流程已保存");
    });

    document.addEventListener("click", event => {
      if (event.target.closest("[data-role-multi]")) return;
      nodeList.querySelectorAll("[data-role-multi].open").forEach(item => {
        item.classList.remove("open");
        item.querySelector(".role-multi-trigger").setAttribute("aria-expanded", "false");
      });
    });

    renderNodes();
  </script>
</body>
</html>
