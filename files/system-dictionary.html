<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>数据字典</title>
  <link rel="stylesheet" href="../resources/style.css">
  <style>
    .dictionary-filter {
      grid-template-columns: minmax(280px, 400px) 1fr auto auto;
    }
    .dictionary-panel .panel-bd {
      padding-top: 16px;
    }
    .dictionary-code {
      color: #34465c;
      font-family: Menlo, Consolas, monospace;
      font-size: 12px;
      white-space: nowrap;
    }
    .dictionary-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      white-space: nowrap;
    }
    .dictionary-current {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--navy);
      font-size: 14px;
      font-weight: 800;
    }
    .dictionary-current[hidden] {
      display: none;
    }
    .dictionary-current code {
      color: #74849a;
      font-family: Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 600;
    }
    .dictionary-edit-modal {
      width: min(680px, calc(100vw - 48px));
    }
    .dictionary-edit-modal .field + .field {
      margin-top: 18px;
    }
    .dictionary-edit-modal textarea {
      width: 100%;
      min-height: 110px;
      box-sizing: border-box;
      resize: vertical;
    }
    .dictionary-edit-modal input[readonly] {
      background: #f4f6f8;
      color: #9aa6b2;
    }
    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 30;
      display: none;
      min-width: 200px;
      padding: 12px 14px;
      border-radius: 6px;
      background: #123152;
      color: #fff;
      box-shadow: 0 14px 32px rgba(18,49,82,.22);
      font-size: 13px;
      font-weight: 700;
    }
    .toast.open { display: block; }
    @media (max-width: 980px) {
      .dictionary-filter { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="filter dictionary-filter">
      <div class="field">
        <label id="keywordLabel">类型关键词</label>
        <input id="keywordFilter" placeholder="类型名称/类型编码">
      </div>
      <div></div>
      <button class="btn primary" id="queryBtn">查询</button>
      <button class="btn" id="resetBtn">重置</button>
    </div>

    <div class="panel dictionary-panel">
      <div class="panel-bd">
        <div class="dictionary-current" id="currentDictionary" hidden>
          <span>当前字典类型：</span><strong id="currentTypeName"></strong><code id="currentTypeCode"></code>
        </div>
        <table>
          <thead id="dictionaryHead"></thead>
          <tbody id="dictionaryRows"></tbody>
        </table>
        <div class="pagination">
          <span id="rowCount">共 0 条</span>
          <button class="page-btn" disabled>上一页</button>
          <button class="page-btn active">1</button>
          <button class="page-btn" disabled>下一页</button>
          <select><option selected>10 条/页</option></select>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask" id="typeEditModal">
    <div class="modal dictionary-edit-modal">
      <div class="panel-hd"><h3>编辑字典类型</h3><button class="btn" data-close-modal>关闭</button></div>
      <div class="panel-bd">
        <div class="field"><label>编码</label><input id="typeEditCode" readonly></div>
        <div class="field"><label class="required">名称</label><input id="typeEditName"></div>
        <div class="field"><label>说明</label><textarea id="typeEditDescription"></textarea></div>
      </div>
      <div class="modal-ft"><button class="btn" data-close-modal>取消</button><button class="btn primary" id="saveTypeBtn">确定</button></div>
    </div>
  </div>

  <div class="modal-mask" id="itemEditModal">
    <div class="modal dictionary-edit-modal">
      <div class="panel-hd"><h3>编辑字典项</h3><button class="btn" data-close-modal>关闭</button></div>
      <div class="panel-bd">
        <div class="field"><label>编码</label><input id="itemEditCode" readonly></div>
        <div class="field"><label class="required">名称</label><input id="itemEditName"></div>
        <div class="field"><label>说明</label><textarea id="itemEditDescription"></textarea></div>
      </div>
      <div class="modal-ft"><button class="btn" data-close-modal>取消</button><button class="btn primary" id="saveItemBtn">确定</button></div>
    </div>
  </div>

  <div class="toast" id="toast">保存成功</div>

  <script>
    const dictionaryTypes = [
      {
        code: "data_channel",
        name: "数据渠道",
        description: "开发者调用系统及会员来源渠道，业务数据保存字典编码",
        updatedAt: "2026-09-16 16:15:30",
        items: [
          { code: "UNION", name: "一体化", sort: 10, description: "一体化平台", updatedAt: "2026-09-16 16:15:30" },
          { code: "ANHUILIN", name: "安荟邻", sort: 20, description: "安荟邻会员系统", updatedAt: "2026-09-16 16:15:30" },
          { code: "CHARGING", name: "充电桩系统", sort: 30, description: "充电桩系统", updatedAt: "2026-09-20 11:23:00" },
          { code: "PARKING", name: "停车系统", sort: 40, description: "停车系统", updatedAt: "2026-09-20 11:23:00" }
        ]
      },
      {
        code: "level_rule_condition_type",
        name: "会员等级条件类型",
        description: "会员等级升级成长值规则的条件类型",
        updatedAt: "2026-09-16 16:15:30",
        items: [
          { code: "POINT_BALANCE", name: "用户积分数", sort: 10, description: "会员当前可用积分数量", updatedAt: "2026-09-16 16:15:30" },
          { code: "OWNER_IDENTITY", name: "业主身份", sort: 20, description: "会员的项目住户身份", updatedAt: "2026-09-16 16:15:30" },
          { code: "RESIDENCE_YEARS", name: "居住时长", sort: 30, description: "会员在项目的居住年限", updatedAt: "2026-09-16 16:15:30" }
        ]
      },
      {
        code: "operation_type",
        name: "操作类型",
        description: "系统操作日志类型",
        updatedAt: "2026-06-01 10:00:00",
        items: [
          { code: "CREATE", name: "新增", sort: 10, description: "新增数据", updatedAt: "2026-06-01 10:00:00" },
          { code: "UPDATE", name: "修改", sort: 20, description: "修改数据", updatedAt: "2026-06-01 10:00:00" },
          { code: "DELETE", name: "删除", sort: 30, description: "删除数据", updatedAt: "2026-06-01 10:00:00" },
          { code: "EXPORT", name: "导出", sort: 40, description: "导出数据", updatedAt: "2026-06-01 10:00:00" }
        ]
      },
      {
        code: "product_exchange_type",
        name: "商品兑换类型",
        description: "V1.65仅保留积分兑换",
        updatedAt: "2026-06-01 10:00:00",
        items: [
          { code: "POINTS", name: "积分兑换", sort: 10, description: "使用积分兑换商品", updatedAt: "2026-06-01 10:00:00" }
        ]
      },
      {
        code: "role_category",
        name: "角色分类",
        description: "系统角色分类",
        updatedAt: "2026-06-01 10:00:00",
        items: [
          { code: "ADMIN", name: "管理角色", sort: 10, description: "系统管理类角色", updatedAt: "2026-06-01 10:00:00" },
          { code: "BUSINESS", name: "业务角色", sort: 20, description: "业务操作类角色", updatedAt: "2026-06-01 10:00:00" }
        ]
      },
      {
        code: "system_user_status",
        name: "系统用户状态",
        description: "系统用户启停状态",
        updatedAt: "2026-06-01 10:00:00",
        items: [
          { code: "ENABLED", name: "启用", sort: 10, description: "用户可正常登录系统", updatedAt: "2026-06-01 10:00:00" },
          { code: "DISABLED", name: "停用", sort: 20, description: "用户不可登录系统", updatedAt: "2026-06-01 10:00:00" }
        ]
      }
    ];

    const params = new URLSearchParams(window.location.search);
    const activeTypeCode = params.get("type") || "";
    let activeType = dictionaryTypes.find(item => item.code === activeTypeCode) || null;
    let editingType = null;
    let editingItem = null;

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("open");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("open"), 1600);
    }

    function getKeyword() {
      return document.getElementById("keywordFilter").value.trim().toLowerCase();
    }

    function renderTypeList() {
      document.getElementById("keywordLabel").textContent = "类型关键词";
      document.getElementById("keywordFilter").placeholder = "类型名称/类型编码";
      document.getElementById("currentDictionary").hidden = true;
      document.getElementById("dictionaryHead").innerHTML = `
        <tr><th>编码</th><th>名称</th><th>字典项数量</th><th>说明</th><th>更新时间</th><th>操作</th></tr>
      `;
      const keyword = getKeyword();
      const rows = dictionaryTypes.filter(item => !keyword || [item.code, item.name, item.description].some(value => value.toLowerCase().includes(keyword)));
      document.getElementById("dictionaryRows").innerHTML = rows.map(item => `
        <tr>
          <td><span class="dictionary-code">${item.code}</span></td>
          <td>${item.name}</td>
          <td>${item.items.length}</td>
          <td>${item.description}</td>
          <td>${item.updatedAt}</td>
          <td><div class="dictionary-actions"><a class="link" href="system-dictionary.html?type=${encodeURIComponent(item.code)}">字典项</a><span class="link" data-edit-type="${item.code}">编辑</span></div></td>
        </tr>
      `).join("");
      document.getElementById("rowCount").textContent = `共 ${rows.length} 条`;
      bindTypeActions();
    }

    function renderItemList() {
      document.getElementById("keywordLabel").textContent = "字典关键词";
      document.getElementById("keywordFilter").placeholder = "名称/编码";
      document.getElementById("currentDictionary").hidden = false;
      document.getElementById("currentTypeName").textContent = activeType.name;
      document.getElementById("currentTypeCode").textContent = `（${activeType.code}）`;
      document.getElementById("dictionaryHead").innerHTML = `
        <tr><th>编码</th><th>名称</th><th>排序</th><th>说明</th><th>更新时间</th><th>操作</th></tr>
      `;
      const keyword = getKeyword();
      const rows = activeType.items.filter(item => !keyword || [item.code, item.name, item.description].some(value => value.toLowerCase().includes(keyword)));
      document.getElementById("dictionaryRows").innerHTML = rows.map(item => `
        <tr>
          <td><span class="dictionary-code">${item.code}</span></td>
          <td>${item.name}</td>
          <td>${item.sort}</td>
          <td>${item.description}</td>
          <td>${item.updatedAt}</td>
          <td><span class="link" data-edit-item="${item.code}">编辑</span></td>
        </tr>
      `).join("");
      document.getElementById("rowCount").textContent = `共 ${rows.length} 条`;
      bindItemActions();
    }

    function bindTypeActions() {
      document.querySelectorAll("[data-edit-type]").forEach(element => {
        element.addEventListener("click", () => {
          editingType = dictionaryTypes.find(item => item.code === element.dataset.editType);
          document.getElementById("typeEditCode").value = editingType.code;
          document.getElementById("typeEditName").value = editingType.name;
          document.getElementById("typeEditDescription").value = editingType.description;
          document.getElementById("typeEditModal").classList.add("open");
        });
      });
    }

    function bindItemActions() {
      document.querySelectorAll("[data-edit-item]").forEach(element => {
        element.addEventListener("click", () => {
          editingItem = activeType.items.find(item => item.code === element.dataset.editItem);
          document.getElementById("itemEditCode").value = editingItem.code;
          document.getElementById("itemEditName").value = editingItem.name;
          document.getElementById("itemEditDescription").value = editingItem.description;
          document.getElementById("itemEditModal").classList.add("open");
        });
      });
    }

    function renderPage() {
      if (activeType) renderItemList();
      else renderTypeList();
    }

    document.getElementById("queryBtn").addEventListener("click", renderPage);
    document.getElementById("resetBtn").addEventListener("click", () => {
      document.getElementById("keywordFilter").value = "";
      renderPage();
    });
    document.getElementById("saveTypeBtn").addEventListener("click", () => {
      if (!editingType) return;
      editingType.name = document.getElementById("typeEditName").value.trim() || editingType.name;
      editingType.description = document.getElementById("typeEditDescription").value.trim();
      document.getElementById("typeEditModal").classList.remove("open");
      renderTypeList();
      showToast("字典类型已更新");
    });
    document.getElementById("saveItemBtn").addEventListener("click", () => {
      if (!editingItem) return;
      editingItem.name = document.getElementById("itemEditName").value.trim() || editingItem.name;
      editingItem.description = document.getElementById("itemEditDescription").value.trim();
      document.getElementById("itemEditModal").classList.remove("open");
      renderItemList();
      showToast("字典项已更新");
    });
    document.querySelectorAll("[data-close-modal]").forEach(element => {
      element.addEventListener("click", () => element.closest(".modal-mask").classList.remove("open"));
    });

    renderPage();
  </script>
</body>
</html>
